[project]
name = "hoop-guide"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ctu-crs>=1.0.6",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hoop_guide"
module-root = ""

[tool.pytest.ini_options]
# tests/lab needs the real robot and is run manually.
testpaths = ["tests/unit", "tests/integration"]
# importlib allows test files with the same name in different folders.
addopts = "--import-mode=importlib --cov --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["hoop_guide"]
# Hardware and terminal layers are tested in the lab, not by unit tests.
omit = [
    "hoop_guide/hardware/robot.py",
    "hoop_guide/ui.py",
    "hoop_guide/viewer/window.py",
    # Interface stubs only, remove from here together with the implementation.
    "hoop_guide/rods.py",
]

[tool.coverage.report]
fail_under = 90
# Interface stubs are not implemented yet.
exclude_also = ["raise NotImplementedError"]

[tool.mypy]
strict = true
python_version = "3.12"
# Module names follow folders, so tests/unit and tests/lab can share file names.
explicit_package_bases = true

# Test fakes and test functions do not need annotations.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# Robot and camera libraries ship without type information.
[[tool.mypy.overrides]]
module = ["ctu_crs.*", "ctu_mars_control_unit.*", "pypylon.*"]
ignore_missing_imports = true

# Google Python Style Guide: https://google.github.io/styleguide/pyguide.html
[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "ANN", # type annotations
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "PL",  # pylint
]

# Google documents __init__ arguments in the class docstring.
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "PLR2004"]
